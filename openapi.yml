openapi: 3.0.3
info:
  title: Timecrack API
  version: 1.0.0
  description: |
    REST API for Timecrack time tracking application powered by Laravel Orion. Authenticate using Bearer tokens generated from your account settings.

    ## Authentication
    All API endpoints require authentication via Bearer token. Generate tokens from your Account page.

    Include the token in the Authorization header:
    ```
    Authorization: Bearer YOUR_API_TOKEN
    ```

    ## Pagination
    List endpoints support pagination via query parameters:
    - `page` - Page number (default: 1)
    - `per_page` - Items per page (default: 15, max: 100)

    ## Filtering (GET requests)
    Use the `filter` query parameter to filter results:
    ```
    ?filter[name]=Website
    ?filter[created_at]=2024-01-01
    ```

    ## Sorting (GET requests)
    Use the `sort` query parameter. Prefix with `-` for descending order:
    ```
    ?sort=-created_at
    ?sort=name,-updated_at
    ```

    ## Including Relations
    Use the `include` query parameter to include related resources:
    ```
    ?include=project,user
    ```

    ## Advanced Search (POST /search)
    Each resource has a `/search` endpoint that accepts a JSON body with advanced options:

    ### Scopes
    Apply model scopes:
    ```json
    {
      "scopes": [
        {"name": "active"},
        {"name": "whereStatus", "parameters": ["completed"]}
      ]
    }
    ```

    ### Filters
    Filter with operators (`=`, `!=`, `<`, `<=`, `>`, `>=`, `like`, `not like`, `in`, `not in`):
    ```json
    {
      "filters": [
        {"field": "project_id", "operator": "=", "value": 1},
        {"field": "created_at", "operator": ">=", "value": "2024-01-01"},
        {"type": "or", "field": "message", "operator": "like", "value": "%bug fix%"}
      ]
    }
    ```

    ### Search
    Full-text search across searchable fields:
    ```json
    {
      "search": {
        "value": "website redesign"
      }
    }
    ```

    ### Sort
    Sort by multiple fields:
    ```json
    {
      "sort": [
        {"field": "started_at", "direction": "desc"},
        {"field": "project_id", "direction": "asc"}
      ]
    }
    ```

    ### Aggregates
    Get aggregate data on relationships:
    ```json
    {
      "aggregates": [
        {"relation": "trackings", "type": "count"},
        {"relation": "users", "type": "count"}
      ]
    }
    ```
    Supported aggregate types: `count`, `sum`, `avg`, `min`, `max`, `exists`

    ## Batch Operations
    - `POST /batch` - Create multiple resources
    - `PATCH /batch` - Update multiple resources
    - `DELETE /batch` - Delete multiple resources

  termsOfService: https://github.com/alextselegidis/timecrack
  contact:
    name: Timecrack
    url: https://github.com/alextselegidis/timecrack
    email: info@alextselegidis.com
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.en.html

servers:
  - url: http://localhost/api/v1
    description: Local development server
  - url: https://your-domain.com/api/v1
    description: Production server

tags:
  - name: Me
    description: Current authenticated user operations
  - name: Projects
    description: Project management operations
  - name: Trackings
    description: Time tracking operations
  - name: Users
    description: User management operations (Admin only)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Token
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        role:
          type: string
          enum: [admin, user]
          example: "user"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Website Redesign"
        description:
          type: string
          nullable: true
          example: "Complete overhaul of the company website"
        color:
          type: string
          nullable: true
          example: "#0d6efd"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Tracking:
      type: object
      properties:
        id:
          type: integer
          example: 1
        project_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        message:
          type: string
          nullable: true
          example: "Implemented login feature"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        project:
          $ref: '#/components/schemas/Project'
        user:
          $ref: '#/components/schemas/User'

    ProjectInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          example: "New Project"
        description:
          type: string
          maxLength: 1000
          nullable: true
        color:
          type: string
          maxLength: 7
          nullable: true
          example: "#198754"

    TrackingInput:
      type: object
      required:
        - project_id
        - user_id
        - started_at
        - ended_at
      properties:
        project_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        message:
          type: string
          maxLength: 1000
          nullable: true

    UserInput:
      type: object
      required:
        - name
        - email
        - role
      properties:
        name:
          type: string
          maxLength: 255
          example: "Jane Doe"
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, user]
        is_active:
          type: boolean

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
        meta:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            to:
              type: integer
            total:
              type: integer

    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object

    SearchRequest:
      type: object
      description: Advanced search request body for POST /search endpoints
      properties:
        scopes:
          type: array
          description: Model scopes to apply
          items:
            type: object
            properties:
              name:
                type: string
                description: Scope name
              parameters:
                type: array
                description: Scope parameters
                items:
                  type: string
            required:
              - name
        filters:
          type: array
          description: Filter conditions
          items:
            type: object
            properties:
              type:
                type: string
                enum: [and, or]
                default: and
                description: Logical operator for combining with previous filters
              field:
                type: string
                description: Field name to filter on
              operator:
                type: string
                enum: ['=', '!=', '<', '<=', '>', '>=', 'like', 'not like', 'in', 'not in']
                default: '='
              value:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      type: string
                description: Filter value
            required:
              - field
              - value
        search:
          type: object
          description: Full-text search
          properties:
            value:
              type: string
              description: Search term
          required:
            - value
        sort:
          type: array
          description: Sort configuration
          items:
            type: object
            properties:
              field:
                type: string
              direction:
                type: string
                enum: [asc, desc]
                default: asc
            required:
              - field
        aggregates:
          type: array
          description: Aggregate calculations on relationships
          items:
            type: object
            properties:
              relation:
                type: string
                description: Relationship name
              type:
                type: string
                enum: [count, sum, avg, min, max, exists]
              field:
                type: string
                description: Field for sum/avg/min/max aggregates
              filters:
                type: array
                description: Filters to apply on the relation
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    operator:
                      type: string
                    value:
                      type: string
            required:
              - relation
              - type

    BatchCreateRequest:
      type: object
      properties:
        resources:
          type: array
          description: Array of resources to create
          items:
            type: object
      required:
        - resources

    BatchUpdateRequest:
      type: object
      properties:
        resources:
          type: array
          description: Array of resources to update (must include id)
          items:
            type: object
            properties:
              id:
                type: integer
            required:
              - id
      required:
        - resources

    BatchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        default: 1
        minimum: 1
    PerPageParam:
      name: per_page
      in: query
      description: Number of items per page (max 100)
      schema:
        type: integer
        default: 15
        minimum: 1
        maximum: 100
    SortParam:
      name: sort
      in: query
      description: |
        Sort field(s). Prefix with `-` for descending order.
        Multiple fields can be comma-separated.
      schema:
        type: string
      examples:
        ascending:
          value: name
          summary: Sort by name ascending
        descending:
          value: -created_at
          summary: Sort by created_at descending
        multiple:
          value: name,-created_at
          summary: Sort by name asc, then created_at desc
    IncludeParam:
      name: include
      in: query
      description: Comma-separated list of relations to include
      schema:
        type: string
    WithCountParam:
      name: with_count
      in: query
      description: Comma-separated list of relations to count
      schema:
        type: string
    IdPathParam:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: integer

security:
  - bearerAuth: []

paths:
  # ============== ME ==============
  /me:
    get:
      tags:
        - Me
      summary: Get current user
      description: Returns the authenticated user's information
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
    put:
      tags:
        - Me
      summary: Update current user profile
      description: Updates the authenticated user's profile information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============== PROJECTS ==============
  /projects:
    get:
      tags:
        - Projects
      summary: List all projects
      description: Returns a paginated list of projects with filtering, sorting, and relation loading. Non-admin users only see projects assigned to them.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/IncludeParam'
        - $ref: '#/components/parameters/WithCountParam'
        - name: filter[name]
          in: query
          schema:
            type: string
        - name: filter[created_at]
          in: query
          schema:
            type: string
            format: date
        - name: filter[updated_at]
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
    post:
      tags:
        - Projects
      summary: Create a project
      description: Creates a new project. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error

  /projects/search:
    post:
      tags:
        - Projects
      summary: Advanced search projects
      description: |
        Search projects with advanced filtering, scopes, sorting, and aggregates.
        Non-admin users only see projects assigned to them.
        Searchable fields: name, description
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/IncludeParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              simpleSearch:
                summary: Simple text search
                value:
                  search:
                    value: "website"
              filteredSearch:
                summary: Search with filters
                value:
                  filters:
                    - field: name
                      operator: "like"
                      value: "%redesign%"
                  sort:
                    - field: name
                      direction: asc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated

  /projects/batch:
    post:
      tags:
        - Projects
      summary: Batch create projects
      description: Create multiple projects at once. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
      responses:
        '200':
          description: Projects created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error
    patch:
      tags:
        - Projects
      summary: Batch update projects
      description: Update multiple projects at once. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateRequest'
      responses:
        '200':
          description: Projects updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error
    delete:
      tags:
        - Projects
      summary: Batch delete projects
      description: Delete multiple projects at once. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resources:
                  type: array
                  items:
                    type: integer
                  description: Array of project IDs to delete
      responses:
        '200':
          description: Projects deleted
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required

  /projects/{id}:
    get:
      tags:
        - Projects
      summary: Get a project
      description: Returns a single project by ID.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/IncludeParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
        '404':
          description: Project not found
    patch:
      tags:
        - Projects
      summary: Update a project
      description: Updates an existing project. Admin only.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Project not found
        '422':
          description: Validation error
    delete:
      tags:
        - Projects
      summary: Delete a project
      description: Deletes a project. Admin only.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Project deleted successfully
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Project not found

  # ============== TRACKINGS ==============
  /trackings:
    get:
      tags:
        - Trackings
      summary: List all trackings
      description: Returns a paginated list of time trackings with filtering, sorting, and relation loading. Non-admin users only see their own trackings.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/IncludeParam'
        - $ref: '#/components/parameters/WithCountParam'
        - name: filter[project_id]
          in: query
          schema:
            type: integer
        - name: filter[user_id]
          in: query
          schema:
            type: integer
        - name: filter[started_at]
          in: query
          schema:
            type: string
            format: date-time
        - name: filter[ended_at]
          in: query
          schema:
            type: string
            format: date-time
        - name: filter[created_at]
          in: query
          schema:
            type: string
            format: date
        - name: filter[updated_at]
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tracking'
        '401':
          description: Unauthenticated
    post:
      tags:
        - Trackings
      summary: Create a tracking
      description: Creates a new time tracking entry. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingInput'
      responses:
        '201':
          description: Tracking created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tracking'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error

  /trackings/search:
    post:
      tags:
        - Trackings
      summary: Advanced search trackings
      description: |
        Search trackings with advanced filtering, scopes, sorting, and aggregates.
        Non-admin users only see their own trackings.
        Searchable fields: message
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/IncludeParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              simpleSearch:
                summary: Simple text search
                value:
                  search:
                    value: "bug fix"
              filteredSearch:
                summary: Search with filters
                value:
                  filters:
                    - field: project_id
                      operator: "="
                      value: 1
                    - field: started_at
                      operator: ">="
                      value: "2024-01-01"
                  sort:
                    - field: started_at
                      direction: desc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tracking'
        '401':
          description: Unauthenticated

  /trackings/batch:
    post:
      tags:
        - Trackings
      summary: Batch create trackings
      description: Create multiple trackings at once. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
      responses:
        '200':
          description: Trackings created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error
    patch:
      tags:
        - Trackings
      summary: Batch update trackings
      description: Update multiple trackings at once. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateRequest'
      responses:
        '200':
          description: Trackings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error
    delete:
      tags:
        - Trackings
      summary: Batch delete trackings
      description: Delete multiple trackings at once. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resources:
                  type: array
                  items:
                    type: integer
                  description: Array of tracking IDs to delete
      responses:
        '200':
          description: Trackings deleted
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required

  /trackings/{id}:
    get:
      tags:
        - Trackings
      summary: Get a tracking
      description: Returns a single tracking entry by ID.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/IncludeParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tracking'
        '401':
          description: Unauthenticated
        '404':
          description: Tracking not found
    patch:
      tags:
        - Trackings
      summary: Update a tracking
      description: Updates an existing tracking entry. Admin only.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingInput'
      responses:
        '200':
          description: Tracking updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tracking'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Tracking not found
        '422':
          description: Validation error
    delete:
      tags:
        - Trackings
      summary: Delete a tracking
      description: Deletes a tracking entry. Admin only.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Tracking deleted successfully
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Tracking not found

  # ============== USERS ==============
  /users:
    get:
      tags:
        - Users
      summary: List all users
      description: Returns a paginated list of users with filtering, sorting, and relation loading. Admin only.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/IncludeParam'
        - $ref: '#/components/parameters/WithCountParam'
        - name: filter[name]
          in: query
          schema:
            type: string
        - name: filter[email]
          in: query
          schema:
            type: string
        - name: filter[role]
          in: query
          schema:
            type: string
            enum: [admin, user]
        - name: filter[is_active]
          in: query
          schema:
            type: boolean
        - name: filter[created_at]
          in: query
          schema:
            type: string
            format: date
        - name: filter[updated_at]
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
    post:
      tags:
        - Users
      summary: Create a user
      description: Creates a new user. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error

  /users/search:
    post:
      tags:
        - Users
      summary: Advanced search users
      description: |
        Search users with advanced filtering, scopes, sorting, and aggregates.
        Admin only.
        Searchable fields: name, email
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/IncludeParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              simpleSearch:
                summary: Simple text search
                value:
                  search:
                    value: "john"
              filteredSearch:
                summary: Search with filters
                value:
                  filters:
                    - field: role
                      operator: "="
                      value: admin
                    - field: is_active
                      operator: "="
                      value: true
                  sort:
                    - field: name
                      direction: asc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required

  /users/batch:
    post:
      tags:
        - Users
      summary: Batch create users
      description: Create multiple users at once. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
      responses:
        '200':
          description: Users created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error
    patch:
      tags:
        - Users
      summary: Batch update users
      description: Update multiple users at once. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateRequest'
      responses:
        '200':
          description: Users updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error
    delete:
      tags:
        - Users
      summary: Batch delete users
      description: Delete multiple users at once. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resources:
                  type: array
                  items:
                    type: integer
                  description: Array of user IDs to delete
      responses:
        '200':
          description: Users deleted
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required

