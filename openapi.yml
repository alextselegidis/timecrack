openapi: 3.0.3
info:
  title: Timecrack API
  version: 1.0.0
  description: |
    REST API for Timecrack time tracking application.
    
    ## Authentication
    
    All API endpoints require authentication using a Bearer token. Generate an API token from your account settings page.
    
    Include the token in the Authorization header:
    ```
    Authorization: Bearer YOUR_API_TOKEN
    ```
  contact:
    name: Timecrack
    url: https://github.com/alextselegidis/timecrack
    email: alextselegidis@gmail.com
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.en.html

servers:
  - url: http://localhost/api/v1
    description: Local development server
  - url: https://your-domain.com/api/v1
    description: Production server

tags:
  - name: Me
    description: Current authenticated user operations
  - name: Projects
    description: Project management operations
  - name: Trackings
    description: Time tracking operations
  - name: Users
    description: User management operations (Admin only)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Token
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        role:
          type: string
          enum: [admin, user]
          example: "user"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Website Redesign"
        description:
          type: string
          nullable: true
          example: "Complete overhaul of the company website"
        color:
          type: string
          nullable: true
          example: "#0d6efd"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Tracking:
      type: object
      properties:
        id:
          type: integer
          example: 1
        project_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        message:
          type: string
          nullable: true
          example: "Implemented login feature"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        project:
          $ref: '#/components/schemas/Project'
        user:
          $ref: '#/components/schemas/User'

    ProjectInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          example: "New Project"
        description:
          type: string
          maxLength: 1000
          nullable: true
        color:
          type: string
          maxLength: 7
          nullable: true
          example: "#198754"

    TrackingInput:
      type: object
      required:
        - project_id
        - user_id
        - started_at
        - ended_at
      properties:
        project_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        message:
          type: string
          maxLength: 1000
          nullable: true

    UserInput:
      type: object
      required:
        - name
        - email
        - role
      properties:
        name:
          type: string
          maxLength: 255
          example: "Jane Doe"
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, user]
        is_active:
          type: boolean

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
        meta:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            to:
              type: integer
            total:
              type: integer

    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object

    OrionSearchRequest:
      type: object
      description: Request body for Orion search endpoints
      properties:
        scopes:
          type: array
          description: Array of scope objects to apply
          items:
            type: object
            properties:
              name:
                type: string
                description: Scope name
              parameters:
                type: array
                description: Optional scope parameters
                items: {}
        filters:
          type: array
          description: Array of filter objects
          items:
            type: object
            properties:
              type:
                type: string
                enum: [and, or]
                default: and
              field:
                type: string
                description: Field name to filter on
              operator:
                type: string
                enum: ['=', '!=', '<', '>', '<=', '>=', 'like', 'not like', 'in', 'not in', 'is null', 'is not null']
                default: '='
              value:
                description: Value to filter by (type depends on operator)
              nested:
                type: array
                description: Nested filter groups
                items:
                  type: object
        search:
          type: object
          description: Full-text search configuration
          properties:
            value:
              type: string
              description: Search term
            case_sensitive:
              type: boolean
              default: false
        sort:
          type: array
          description: Array of sort objects
          items:
            type: object
            properties:
              field:
                type: string
              direction:
                type: string
                enum: [asc, desc]
                default: asc
        aggregates:
          type: array
          description: Array of aggregate objects for relation statistics
          items:
            type: object
            properties:
              relation:
                type: string
                description: Relation name
              type:
                type: string
                enum: [count, min, max, avg, sum, exists]
              field:
                type: string
                description: Field for min/max/avg/sum aggregates
              filters:
                type: array
                description: Optional filters for the aggregate
                items:
                  type: object
        includes:
          type: array
          description: Array of relation includes
          items:
            type: object
            properties:
              relation:
                type: string
              filters:
                type: array
                items:
                  type: object

  parameters:
    OrionPage:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        default: 1
        minimum: 1
    OrionLimit:
      name: limit
      in: query
      description: Number of results per page (max 500)
      schema:
        type: integer
        default: 15
        minimum: 1
        maximum: 500
    OrionSort:
      name: sort
      in: query
      description: |
        Sort results by field. Prefix with `-` for descending order.
        Examples: `name`, `-created_at`, `name,-updated_at`
      schema:
        type: string
    OrionIncludes:
      name: include
      in: query
      description: |
        Comma-separated list of relations to include.
        Examples: `users`, `trackings`, `project,user`
      schema:
        type: string
    OrionFilters:
      name: filters
      in: query
      description: |
        JSON-encoded array of filter objects for advanced filtering.
        Each filter object has: `field`, `operator`, `value`.
        
        Supported operators: `=`, `!=`, `<`, `>`, `<=`, `>=`, `like`, `not like`, `in`, `not in`, `is null`, `is not null`
        
        Example: `[{"field":"name","operator":"like","value":"%project%"}]`
      schema:
        type: string
    OrionSearch:
      name: search
      in: query
      description: |
        JSON-encoded search object with `value` and optional `case_sensitive` flag.
        Searches across all searchable fields defined on the model.
        
        Example: `{"value":"website"}`
      schema:
        type: string
    OrionScopes:
      name: scopes
      in: query
      description: |
        JSON-encoded array of scope objects to apply.
        Each scope object has: `name` and optional `parameters`.
        
        Example: `[{"name":"active"}]`
      schema:
        type: string
    OrionAggregate:
      name: aggregate
      in: query
      description: |
        JSON-encoded array of aggregate objects for relation counts/sums.
        Each object has: `relation`, `type` (count, min, max, avg, sum), optional `field`, optional `filters`.
        
        Example: `[{"relation":"trackings","type":"count"}]`
      schema:
        type: string
    OrionWithTrashed:
      name: with_trashed
      in: query
      description: Include soft-deleted records (if model uses SoftDeletes)
      schema:
        type: boolean
        default: false
    OrionOnlyTrashed:
      name: only_trashed
      in: query
      description: Return only soft-deleted records (if model uses SoftDeletes)
      schema:
        type: boolean
        default: false
    OrionForceDelete:
      name: force
      in: query
      description: Permanently delete a soft-deleted record (use with DELETE requests)
      schema:
        type: boolean
        default: false

security:
  - bearerAuth: []

paths:
  /me:
    get:
      tags:
        - Me
      summary: Get current user profile
      description: Returns the authenticated user's profile information.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
    put:
      tags:
        - Me
      summary: Update current user profile
      description: Updates the authenticated user's profile information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects:
    get:
      tags:
        - Projects
      summary: List projects
      description: Returns a paginated list of projects. Non-admin users only see projects assigned to them.
      parameters:
        - $ref: '#/components/parameters/OrionPage'
        - $ref: '#/components/parameters/OrionLimit'
        - $ref: '#/components/parameters/OrionSort'
        - $ref: '#/components/parameters/OrionIncludes'
        - $ref: '#/components/parameters/OrionFilters'
        - $ref: '#/components/parameters/OrionSearch'
        - $ref: '#/components/parameters/OrionScopes'
        - $ref: '#/components/parameters/OrionAggregate'
        - $ref: '#/components/parameters/OrionWithTrashed'
        - $ref: '#/components/parameters/OrionOnlyTrashed'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
    post:
      tags:
        - Projects
      summary: Create a project
      description: Creates a new project. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error

  /projects/search:
    post:
      tags:
        - Projects
      summary: Search projects
      description: |
        Advanced search endpoint for projects with filtering, sorting, and aggregation.
        Non-admin users only see projects assigned to them.
      parameters:
        - $ref: '#/components/parameters/OrionPage'
        - $ref: '#/components/parameters/OrionLimit'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrionSearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated

  /projects/{id}:
    get:
      tags:
        - Projects
      summary: Get a project
      description: Returns a single project by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/OrionIncludes'
        - $ref: '#/components/parameters/OrionAggregate'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
        '404':
          description: Project not found
    patch:
      tags:
        - Projects
      summary: Update a project
      description: Updates an existing project. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Project not found
        '422':
          description: Validation error
    delete:
      tags:
        - Projects
      summary: Delete a project
      description: Deletes a project. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/OrionForceDelete'
      responses:
        '200':
          description: Project deleted successfully
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Project not found

  /trackings:
    get:
      tags:
        - Trackings
      summary: List trackings
      description: Returns a paginated list of time trackings. Non-admin users only see their own trackings.
      parameters:
        - $ref: '#/components/parameters/OrionPage'
        - $ref: '#/components/parameters/OrionLimit'
        - $ref: '#/components/parameters/OrionSort'
        - $ref: '#/components/parameters/OrionIncludes'
        - $ref: '#/components/parameters/OrionFilters'
        - $ref: '#/components/parameters/OrionSearch'
        - $ref: '#/components/parameters/OrionScopes'
        - $ref: '#/components/parameters/OrionAggregate'
        - $ref: '#/components/parameters/OrionWithTrashed'
        - $ref: '#/components/parameters/OrionOnlyTrashed'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tracking'
        '401':
          description: Unauthenticated
    post:
      tags:
        - Trackings
      summary: Create a tracking
      description: Creates a new time tracking entry. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingInput'
      responses:
        '201':
          description: Tracking created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tracking'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error

  /trackings/search:
    post:
      tags:
        - Trackings
      summary: Search trackings
      description: |
        Advanced search endpoint for trackings with filtering, sorting, and aggregation.
        Non-admin users only see their own trackings.
      parameters:
        - $ref: '#/components/parameters/OrionPage'
        - $ref: '#/components/parameters/OrionLimit'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrionSearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tracking'
        '401':
          description: Unauthenticated

  /trackings/{id}:
    get:
      tags:
        - Trackings
      summary: Get a tracking
      description: Returns a single tracking entry by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/OrionIncludes'
        - $ref: '#/components/parameters/OrionAggregate'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tracking'
        '401':
          description: Unauthenticated
        '404':
          description: Tracking not found
    patch:
      tags:
        - Trackings
      summary: Update a tracking
      description: Updates an existing tracking entry. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingInput'
      responses:
        '200':
          description: Tracking updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tracking'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Tracking not found
        '422':
          description: Validation error
    delete:
      tags:
        - Trackings
      summary: Delete a tracking
      description: Deletes a tracking entry. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/OrionForceDelete'
      responses:
        '200':
          description: Tracking deleted successfully
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Tracking not found

  /users:
    get:
      tags:
        - Users
      summary: List users
      description: Returns a paginated list of users. Admin only.
      parameters:
        - $ref: '#/components/parameters/OrionPage'
        - $ref: '#/components/parameters/OrionLimit'
        - $ref: '#/components/parameters/OrionSort'
        - $ref: '#/components/parameters/OrionIncludes'
        - $ref: '#/components/parameters/OrionFilters'
        - $ref: '#/components/parameters/OrionSearch'
        - $ref: '#/components/parameters/OrionScopes'
        - $ref: '#/components/parameters/OrionAggregate'
        - $ref: '#/components/parameters/OrionWithTrashed'
        - $ref: '#/components/parameters/OrionOnlyTrashed'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
    post:
      tags:
        - Users
      summary: Create a user
      description: Creates a new user. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation error

  /users/search:
    post:
      tags:
        - Users
      summary: Search users
      description: |
        Advanced search endpoint for users with filtering, sorting, and aggregation.
        Admin only.
      parameters:
        - $ref: '#/components/parameters/OrionPage'
        - $ref: '#/components/parameters/OrionLimit'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrionSearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user
      description: Returns a single user by ID. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/OrionIncludes'
        - $ref: '#/components/parameters/OrionAggregate'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: User not found
    patch:
      tags:
        - Users
      summary: Update a user
      description: Updates an existing user. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: User not found
        '422':
          description: Validation error
    delete:
      tags:
        - Users
      summary: Delete a user
      description: Deletes a user. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/OrionForceDelete'
      responses:
        '200':
          description: User deleted successfully
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - Admin access required
        '404':
          description: User not found
